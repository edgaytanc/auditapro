<div class="ap-notif-filter-group" aria-label="Filtrar notificaciones">
  <span class="ap-notif-filter-label">Estado</span>

  <a
    href="{% url 'notifications' %}"
    class="ap-notif-filter {% if not request.GET.filter %}active{% endif %}"
  >
    <i class="bi bi-grid"></i>
    Todas
  </a>

  <a
    href="{% url 'notifications' %}?filter=not_readed"
    class="ap-notif-filter {% if request.GET.filter == 'not_readed' %}active{% endif %}"
  >
    <i class="bi bi-envelope"></i>
    No leídas
  </a>

  <a
    href="{% url 'notifications' %}?filter=readed"
    class="ap-notif-filter {% if request.GET.filter == 'readed' %}active{% endif %}"
  >
    <i class="bi bi-envelope-open"></i>
    Leídas
  </a>
</div>
